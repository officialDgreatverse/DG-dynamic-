name: Build Signed APK

on:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version name / compute version code
        id: ver
        run: |
          NAME=$(node -p "require('./version.json').versionName")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        run: |
          npm install
          npm install @capacitor/filesystem @capacitor-community/media

      - name: Add Android platform (fresh each build, from capacitor.config.json)
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Generate app icons
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Set versionCode / versionName in build.gradle
        run: |
          GRADLE=android/app/build.gradle
          echo "---- before ----"; grep -n "versionCode\|versionName" "$GRADLE" || true
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.ver.outputs.code }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.name }}\"/" "$GRADLE"
          echo "---- after ----"; grep -n "versionCode\|versionName" "$GRADLE"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore.jks

      - name: Add release signing config
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/Projects-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}.apk"

      - name: Publish GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}
          name: v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          files: out/*.apk